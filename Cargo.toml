[package]
name = "aah"
version = "0.1.0"
edition = "2024"
default-run = "aah"

[workspace]
members = ["packages/*", "xtasks/*"]

[workspace.dependencies]
auto-play = { path = "../auto-play" }
# auto-play = { git = "https://github.com/AzurIce/auto-play" }
aah-resource = { path = "packages/aah-resource" }
image = { version = "0.25.9", features = ["serde"] }
imageproc = "0.25.0"
anyhow = "1.0.100"
async-channel = "2.5.0"
serde = { version = "1.0.228" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
auto-play.workspace = true
aah-resource.workspace = true
image.workspace = true
anyhow.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust-embed = "8.11.0"
tokio-stream = "0.1.18"
iced = { version = "0.13.1", features = ["tokio", "image"] }
clap = { version = "4.5.54", features = ["derive"] }
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
tokio = { version = "1.49.0", features = ["full"] }
env_logger = "0.11.8"
serde = { workspace = true, features = ["derive"] }
toml = "0.9.8"
color-print = "0.3.7"
serde_with = { version = "3.16.1", features = ["macros"] }
log = "0.4.29"
bytes = "1.11.0"
serde_json = "1.0.149"
chrono = "0.4.43"
time = { version = "0.3.45", features = ["serde", "parsing", "macros"] }
zip = "7.1.0"
imageproc.workspace = true
# ocrs = "0.11.0"
ocrs = { git = "https://github.com/robertknight/ocrs" }

rand = "0.9.2"
futures = { version = "0.3.30", optional = true }
rten = "0.24.0"
regex = "1.10.5"
ndarray = "0.17.2"
